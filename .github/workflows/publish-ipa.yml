name: Publish unsigned iPhone prototype
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check controls and compile native screens
        run: bash scripts/check_source.sh
      - name: Restore verified original client archive
        uses: actions/cache/restore@v4
        with:
          path: build/original-client/client.rar
          key: bfh-client-7b77439053f6e79ebf5a9020b22aff85e49195e6
      - name: Recover and convert original map and weapon assets
        run: bash scripts/prepare_original_assets.sh
      - name: Cache verified original client archive
        uses: actions/cache/save@v4
        with:
          path: build/original-client/client.rar
          key: bfh-client-7b77439053f6e79ebf5a9020b22aff85e49195e6
      - name: Validate original character assets
        run: bash scripts/check_animation.sh
      - name: Build and test
        run: bash scripts/build_unsigned.sh
      - name: Attach IPA to private prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="prototype-${GITHUB_SHA:0:12}"
          files=(build/PocketFront-unsigned.ipa)
          if [ -f build/original-map-preview.png ]; then files+=(build/original-map-preview.png); fi
          if [ -f build/original-wardrobe-preview.png ]; then files+=(build/original-wardrobe-preview.png); fi
          gh release create "$tag" "${files[@]}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "iPhone prototype ${GITHUB_SHA:0:12}" \
            --notes "Unsigned ARM64 iPhone prototype. SceneKit import, game-core checks and Xcode build passed. Requires device signing. Original faction models use original weighted skeletal animation. Original heat map, clothing catalog, item icons and selectable weapon models are converted from the verified 1.105 client. Includes fixed world-up camera, jump, drag-to-aim fire, saved hero outfits and two weapon slots. Gameplay fidelity and the rest of the maps and vehicles remain unfinished."
