name: Build unsigned iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main, "codex/pocketfront-ios"]
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  simulation:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate gameplay and bot tactics
        run: |
          mkdir -p build
          swiftc -O App/Game.swift Tests/main.swift -o build/core-tests
          build/core-tests
  build:
    needs: simulation
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check controls and compile native screens
        run: bash scripts/check_source.sh
      - name: Restore verified original client archive
        uses: actions/cache/restore@v4
        with:
          path: build/original-client/client.rar
          key: bfh-client-7b77439053f6e79ebf5a9020b22aff85e49195e6
      - name: Restore converted original images
        uses: actions/cache/restore@v4
        with:
          path: |
            Assets/Wardrobe/textures
            Assets/Wardrobe/icons
            Assets/OriginalWorld/textures
          key: bfh-original-images-7b77439053f6e79ebf5a9020b22aff85e49195e6-rgba-v1
      - name: Recover and convert original map and weapon assets
        run: bash scripts/prepare_original_assets.sh
      - name: Cache converted original images
        uses: actions/cache/save@v4
        with:
          path: |
            Assets/Wardrobe/textures
            Assets/Wardrobe/icons
            Assets/OriginalWorld/textures
          key: bfh-original-images-7b77439053f6e79ebf5a9020b22aff85e49195e6-rgba-v1
      - name: Cache verified original client archive
        uses: actions/cache/save@v4
        with:
          path: build/original-client/client.rar
          key: bfh-client-7b77439053f6e79ebf5a9020b22aff85e49195e6
      - name: Validate original meshes and skeletal playback
        run: bash scripts/check_animation.sh
      - name: Build and test
        run: bash scripts/build_unsigned.sh
      - name: Capture native original-style menus and gameplay
        run: bash scripts/check_interface.sh
      - name: Publish verified IPA to prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="prototype-${GITHUB_SHA:0:12}"
          files=(build/PocketFront-unsigned.ipa build/original-menu-native.png build/original-wardrobe-native.png build/original-abilities-native.png build/original-gameplay-native.png)
          if [ -f build/original-map-preview.png ]; then files+=(build/original-map-preview.png); fi
          if [ -f build/original-wardrobe-preview.png ]; then files+=(build/original-wardrobe-preview.png); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --prerelease \
              --title "iPhone prototype ${GITHUB_SHA:0:12}" \
              --notes "Verified unsigned ARM64 iPhone prototype. Original 1.105 map, clothing, icons, menu parchment, panel frames, animated faction flags and weapon models. Reference-based Flash-style menu, inventory and HUD layout. Native simulator screenshots attached; animated hero customization, two weapon slots, jumping and crosshair-directed 3D touch shooting. Requires device signing. Full original gameplay and UI fidelity remain unfinished."
          fi
